name: Verify and Release
on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Enable Corepack
              run: |
                  corepack enable
                  corepack prepare yarn@4.14.1 --activate
                  yarn --version

            - name: Install dependencies
              run: yarn install --immutable

            - name: Run lint, tests, and other verification
              run: yarn build

    release:
        name: Release
        runs-on: ubuntu-latest
        needs: verify
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Enable Corepack
              run: |
                  corepack enable
                  corepack prepare yarn@4.14.1 --activate
                  yarn --version

            - name: Install dependencies
              run: yarn install --immutable

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: yarn release
